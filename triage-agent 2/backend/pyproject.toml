[project]
name = "triage-agent"
version = "0.1.0"
description = "Customer support ticket triage agent: CrewAI Flows + RAG + FastAPI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai==1.15.45",
    "qdrant-client~=1.14.3",
    "fastembed==0.9.1",
    "pillow>=13",
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "sqlmodel==0.0.50",
    "pyyaml>=6.0",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.crews" = ["*/config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
